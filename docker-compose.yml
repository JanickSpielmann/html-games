name: winkel-games

services:
  web:
    image: nginx:1.27-alpine
    container_name: winkel-games
    restart: unless-stopped
    depends_on:
      - api
    ports:
      # Nur zum Testen direkt auf dem Mac (http://localhost:8088). Von aussen kommt alles über Caddy.
      - "127.0.0.1:${GAMES_PORT:-8088}:80"
    volumes:
      # Das ganze Repo, nur lesend. Nach einem git pull ist alles sofort live.
      - ./:/usr/share/nginx/html:ro
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
    networks:
      - default
      - proxy

  api:
    build: ./api
    container_name: winkel-games-api
    restart: unless-stopped
    volumes:
      # Bestenlisten liegen in einem Docker Volume, nicht im Repo
      - games-data:/data

networks:
  proxy:
    # Gemeinsames Netzwerk mit Caddy, einmalig per "docker network create proxy" angelegt
    external: true

volumes:
  games-data:
