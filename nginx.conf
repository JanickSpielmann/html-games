server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Bestenlisten: nur GET und PUT auf /api/<spiel>, begrenzte Grösse.
    # /api/db (gesamte Datenbank) bleibt gesperrt.
    location ~ ^/api/(?!db$)[a-z0-9-]+$ {
        limit_except GET PUT { deny all; }
        client_max_body_size 64k;
        rewrite ^/api/(.*)$ /$1 break;
        proxy_pass http://api:3000;
        proxy_set_header Host $host;
        add_header Cache-Control "no-store";
    }
    location /api/ {
        return 404;
    }

    # Seiten sollen sich nach einem Update sofort aktualisieren
    location ~* \.html$ {
        add_header Cache-Control "no-cache";
    }

    # Konfigurationsdateien und Quellen nicht ausliefern
    location ~ ^/(docker-compose\.yml|nginx\.conf|README\.md|LICENSE)$ {
        return 404;
    }

    # Versteckte Dateien (z.B. .git, .env) nicht ausliefern
    location ~ /\. {
        return 404;
    }

    gzip on;
    gzip_types text/css application/javascript image/svg+xml application/json;
}

